[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
runOnSave = true
